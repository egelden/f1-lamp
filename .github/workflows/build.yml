name: Build ESPHome Firmware 

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: pip install esphome

      - name: Build firmware
        run: |
          mkdir -p build
          esphome compile esphome/f1_led_strip.yaml

      - name: Debug ESPHome build output
        run: |
         echo "=== ESPHome build directory ==="
         ls -R .esphome/build
      
      - name: Locate firmware file
        id: find_fw
        run: |
          FIRMWARE=$(find .esphome/build -type f -name "*.bin" | head -n 1)
          echo "Firmware found at: $FIRMWARE"
          echo "firmware_path=$FIRMWARE" >> $GITHUB_OUTPUT

      - name: Copy firmware to build folder
        run: |
          cp "${{ steps.find_fw.outputs.firmware_path }}" build/f1-lamp.bin

      - name: Generate version.json
        run: |
          VERSION=$(date +"%Y.%m.%d-%H%M")
          echo "{ \"version\": \"$VERSION\", \"url\": \"https://raw.githubusercontent.com/${{ github.repository }}/main/build/f1-lamp.bin\" }" > build/version.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f1-lamp-firmware
          path: build/

      - name: Commit build artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build firmware"
          git push
