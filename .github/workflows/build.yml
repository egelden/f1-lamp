name: Build ESPHome Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install ESPHome
        run: pip install esphome

      - name: Generate version.json and build_info.yaml
        run: |
          VERSION=$(date +"%Y.%m.%d-%H%M")

          # version.json in /build/
          mkdir -p build
          echo "{ \"version\": \"$VERSION\", \"url\": \"https://raw.githubusercontent.com/${{ github.repository }}/main/build/f1-lamp.bin\" }" > build/version.json

          # build_info.yaml in /esphome/
          echo "substitutions:" > esphome/build_info.yaml
          echo "  firmware_version: \"$VERSION\"" >> esphome/build_info.yaml

      - name: Debug build_info.yaml
        run: |
          echo "=== build_info.yaml ==="
          ls -al esphome
          cat esphome/build_info.yaml || echo "FILE NOT FOUND"

      - name: Build firmware
        run: |
          esphome compile esphome/f1_led_strip.yaml

      - name: Locate OTA-compatible firmware
        id: find_fw
        run: |
          FIRMWARE=$(find esphome/.esphome/build -type f -name "firmware.ota.bin" | head -n 1)

          if [ -z "$FIRMWARE" ]; then
            FIRMWARE=$(find esphome/.esphome/build -type f -name "firmware.bin" | head -n 1)
          fi

          echo "Firmware found at: $FIRMWARE"

          if [ -z "$FIRMWARE" ]; then
            echo "No OTA-compatible firmware found!"
            exit 1
          fi

          echo "firmware_path=$FIRMWARE" >> $GITHUB_OUTPUT

      - name: Copy firmware to build folder
        run: |
          cp "${{ steps.find_fw.outputs.firmware_path }}" build/f1-lamp.bin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f1-lamp-firmware
          path: build/

      - name: Commit build artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add build/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build firmware"
          git push
